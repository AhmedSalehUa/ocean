org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Disable Kotlin incremental compilation. On Windows the incremental
# caches-jvm folder frequently gets locked (antivirus / lingering daemon),
# causing "Storage ... is already registered" / "Could not delete caches-jvm"
# build failures. Turning it off avoids that cache entirely.
kotlin.incremental=false
